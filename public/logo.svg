<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Light from the top-left. A radial gradient, so it fades out instead of
         ending on a visible arc the way a flat circle does. -->
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bell" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Telegram crops avatars to a circle, so the background is full-bleed -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Scaled up about the artwork's own centre (256, 254): Telegram crops the
       avatar to a circle, so the bell has to fill it, not the square. -->
  <g transform="translate(256 254) scale(1.18) translate(-256 -254)">
  <!-- Bell: handle top y=136, clapper bottom y=372 -->
  <g filter="url(#soft)" fill="url(#bell)">
    <!-- Handle, sized to meet the dome exactly at y=168 -->
    <circle cx="256" cy="152" r="16"/>
    <!-- Dome: 56px straight sides above an 88px radius shoulder -->
    <path d="M 168 312 v -56 a 88 88 0 0 1 176 0 v 56 z"/>
    <!-- Rim -->
    <rect x="144" y="312" width="224" height="32" rx="16"/>
    <!-- Clapper -->
    <path d="M 228 344 a 28 28 0 0 0 56 0 z"/>
  </g>

  <!-- Motion arcs, concentric with the dome: the bell is ringing -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 128 286 a 78 78 0 0 1 10 -78"/>
    <path d="M 384 286 a 78 78 0 0 0 -10 -78"/>
  </g>
  </g>
</svg>
